  - name: vw_dda_effectiveness
    description: "VIEW TABLE ( READ )


      No indexes, calculations already made from the raw tables


      FUNCTIONS THAT CREATED A VISIONARY TABLE ALONG WITH THE CALCULATIONS

      ___________________________________________________________________________________

      DIRECT LINEAGE ( naturally fetch from the source of truth table ) :

      Source of Truth : dda_events

      - \"dda_event_id\"

      - \"student_id\"

      - \"trigger_reason\"

      - \"visual_analogy_used\"


      Source of Truth : class_sections

      - \"grade_level\"


      Source of Truth : math_skills

      - \"skill_name\"


      Source of Truth : math_topic

      - \"topic_name\"


      Source of Truth : difficulty_levels

      - \"skill_name\"


      FILTERED LINEAGE (CREATED A FUNCTION TO FILTER IT OUT) |\ 

      SAME NAME:

      CTE:\ 

      - NONE


      RENAMED:

      -  \"event_created_at\" ( created_at )


      CTE : latest_feature : WRAPPED : feature_ranked : Source of Truth : student_skill_feautures

      - \"latest_accuracy_rate\" WHERE f.row_num = 1 ( accuracy_rate )


      CTE : latest_prediction : WRAPPED : prediction_ranked : Source of Truth : student_skill_prediction

      - \"latest_risk_level\" ( risk_level )


      DERIVED AGGREGATED LINEAGE

      CTE : help_agg : Source of Truth : student_help_events

      COUNT(*) AS \"related_help_event_count\"


      CTE : show_me_agg : Source of Truth : show_me_breakdowns

      COUNT(*)  AS \"related_show_me_count\"

      COUNT(*) > 0 AS \"show_me_triggered\"


      JOIN-ENRICHED LINEAGE (self-join)

      Join path:

      dda_events.previous_difficulty_id → difficulty_levels.difficulty_id

      dda_events.new_difficulty_id → difficulty_levels.difficulty_id


      ___________________________________________________________________________________

      NO LINEAGE ( created from Direct/Filtered Lineage )

      - NONE


      ___________________________________________________________________________________"
    columns:
      - name: dda_event_id
        description: DIRECT LINEAGE
      - name: student_id
        description: DIRECT LINEAGE
      - name: grade_level
        description: DIRECT LINEAGE
      - name: skill_name
        description: DIRECT LINEAGE
      - name: topic_name
        description: DIRECT LINEAGE
      - name: trigger_reason
        description: DIRECT LINEAGE
      - name: previous_difficulty_name
        description: |-
          JOIN-ENRICHED LINEAGE (self-join)
          dda_events.previous_difficulty_id → difficulty_levels.difficulty_id
      - name: previous_difficulty_value
        description: |-
          JOIN-ENRICHED LINEAGE (self-join)
          dda_events.new_difficulty_id → difficulty_levels.difficulty_id
      - name: new_difficulty_name
        description: |-
          JOIN-ENRICHED LINEAGE (self-join)
          dda_events.new_difficulty_id → difficulty_levels.difficulty_id
      - name: new_difficulty_value
        description: |-
          JOIN-ENRICHED LINEAGE (self-join)
          dda_events.new_difficulty_id → difficulty_levels.difficulty_id
      - name: visual_analogy_used
        description: DIRECT LINEAGE
      - name: event_created_at
        description: |-
          FILTERED LINEAGE ( RENAMED )
          - "created_at"
      - name: related_help_event_count
        description: |-
          DERIVED AGGREGATED LINEAGE
          CTE : help_agg : Source of Truth : student_help_events
      - name: related_show_me_count
        description: |-
          CTE : show_me_agg : Source of Truth : show_me_breakdowns
          COUNT(*)  AS "related_show_me_count"
      - name: show_me_triggered
        description: |-
          CTE : show_me_agg : Source of Truth : show_me_breakdowns
          COUNT(*) > 0 AS "show_me_triggered"
      - name: latest_accuracy_rate
        description: "FILTERED LINEAGE ( RENAME )

          CTE : latest_feature : WRAPPED : feature_ranked : Source of Truth : student_skill_feautures


          WHERE f.row_num = 1

          #Row_number ranking"
      - name: latest_risk_level
        description: "FILTERED LINEAGE ( RENAME )

          CTE : latest_prediction : WRAPPED : prediction_ranked : Source of Truth : student_skill_prediction


          WHERE f.row_num = 1\ 

          #Row_number ranking"
  - name: vw_gamification_summary
    description: "VIEW TABLE ( READ )


      No indexes, calculations already made from the raw tables


      FUNCTIONS THAT CREATED A VISIONARY TABLE ALONG WITH THE CALCULATIONS

      ___________________________________________________________________________________

      DIRECT LINEAGE ( naturally fetch from the source of truth table ) :

      Source of Truth : student_profiles

      - \"student_id\"

      - \"total_star_points\"

      - \"current_streak\"


      Source of Truth : avatars

      - \"avatar_name\"



      FILTERED LINEAGE (CREATED A FUNCTION TO FILTER IT OUT) |\ 

      SAME NAME:

      CTE: item_agg : Source of Truth : student_avatar_items

      -  COUNT(*) FILTER (WHERE sai.equipped IS TRUE) AS equipped_item_count


      RENAMED:

      -  \"event_created_at\" ( created_at )


      DERIVED AGGREGATED LINEAGE

      CTE : reward_agg : Source of Truth : reward_transactions

      - SUM(points_earned) \"total_points_earned\"

      - COUNT(*)  \"reward_transaction_count\" #Count all records

      - \"latest_reward_reason\" # number one (1) position for award latest

      - MAX ( created_at ) latest_reward_reason #last it was created


      CTE : item_agg : Source of Truth : student_avatar_items

      -  COUNT(*) AS unlocked_item_count




      ___________________________________________________________________________________

      NO LINEAGE ( created from Direct/Filtered Lineage )

      - NONE


      ___________________________________________________________________________________"
    columns:
      - name: student_id
        description: DIRECT LINEAGE
      - name: avatar_name
        description: DIRECT LINEAGE
      - name: total_star_points
        description: DIRECT LINEAGE
      - name: current_streak
        description: DIRECT LINEAGE
      - name: total_points_earned
        description: DERIVED AGGREGATED LINEAGE

          SUM(points_earned) "total_points_earned"
      - name: reward_transaction_count
        description: |-
          DERIVED AGGREGATED LINEAGE
          COUNT(*)  "reward_transaction_count" #Count all records
      - name: latest_reward_reason
        description: |-
          DERIVED AGGREGATED LINEAGE
          # number one (1) position for award latest
      - name: latest_reward_at
        description: |-
          DERIVED AGGREGATED LINEAGE
           MAX ( created_at ) latest_reward_reason #last it was created
      - name: unlocked_item_count
        description: DERIVED AGGREGATED LINEAGE

          COUNT(*) AS unlocked_item_count
      - name: equipped_item_count
        description: FILTERED LINEAGE

          COUNT(*) FILTER (WHERE sai.equipped IS TRUE) AS equipped_item_count
      - name: item_details
        description: |-
          DERIVED AGGREGATED LINEAGE
          JSONB_AG #multiple columns for a singular column
