  - name: vw_parent_child_progress
    description: "VIEW TABLE ( READ )


      No indexes, calculations already made from the raw tables


      FUNCTIONS THAT CREATED A VISIONARY TABLE ALONG WITH THE CALCULATIONS

      ___________________________________________________________________________________

      DIRECT LINEAGE ( naturally fetch from the source of truth table ) :

      Source of Truth : class_sections

      - \"section_name\"

      - \"grade_level\"


      Source of Truth : student_profile

      - \"learning_status\"

      - \"current_streak\"

      - \"total_star_points\"


      FILTERED LINEAGE (CREATED A FUNCTION TO FILTER IT OUT) |\ 

      SAME NAME:

      CTE: unique_link : Wrapped : link_ranked : Source of Truth : student_parent_links

      - \"parent_id\"

      - \"student_id\"

      - \"relationship_type\"

      - \"is_primary_guardian\"


      CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

      - \"correct_attempts\" #Gets the total sum

      - \"help_request_count\" #Gets the total sum


      RENAMED:

      CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

      -  \"total_answer_attempts\" ( total_attempts ) #Gets the total sum

      - \"last_activity_at\" ( last_attempt_at ) #Gets the Latest activity\ 


      CTE : risk_agg : Wrapped : prediction_ranked : Source of Truth : student_skill_predictation

      - \"risk_level\" WHERE = \"at_risk\" ( at_risk_skill_count )

      - \"risk_level\" WHERE = \"needs_practice\" ( need_practice_skill_count)



      CTE : recommendation_agg : Source of Truth : learning_recommendations

      - \"is_completed\" WHERE = FALSE ( active_recommendation_count )

      - \"is_completed\" WHERE  = FALSE # but position must be 1 (highest_priority_recommendation)


      ___________________________________________________________________________________

      NO LINEAGE ( created from Direct/Filtered Lineage )

      - \"wrong_attempts\" = \"total_answer_attempts\" - \"correct_attempts\"

      - \"overall_accuracy_rate\" = \"correct_attempts\" / \"total_answer_attempts\"


      ___________________________________________________________________________________"
    columns:
      - name: parent_id
        description: FILTERED LINEAGE
      - name: student_id
        description: FILTERED LINEAGE
      - name: relationship_type
        description: FILTERED LINEAGE
      - name: is_primary_guardian
        description: FILTERED LINEAGE
      - name: section_name
        description: DIRECT LINEAGE
      - name: grade_level
        description: DIRECT LINEAGE
      - name: learning_status
        description: DIRECT LINEAGE
      - name: current_streak
        description: DIRECT LINEAGE
      - name: total_star_points
        description: DIRECT LINEAGE
      - name: total_answer_attempts
        description: |-
          FILTERED LINEAGE ( RENAME) : "total_attempts" to "total_answer_attempts"
          CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

          SUM("total_attempts")
      - name: correct_attempts
        description: |-
          FILTERED LINEAGE ( SAME NAME ) 
          CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

          SUM("correct_attempts")
      - name: wrong_attempts
        description: |-
          NO LINEAGE

          "total_answer_attempts" - "correct_attempts"
      - name: overall_accuracy_rate
        description: |-
          NO LINEAGE

          "correct_attempts" / "total_answer_attempts"
      - name: help_request_count
        description: |-
          FILTERED LINEAGE ( SAME NAME ) 
          CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

          SUM("help_request_count)
      - name: last_activity_at
        description: |-
          FILTERED LINEAGE ( RENAME) : "last_attempt_at" to "last_activity_at"
          CTE :  feauture_agg : Wrapped : feature ranked : Source of Truth : student_skill_feautures

          MAX("last_attempt_at")
      - name: at_risk_skill_count
        description: |-
          FILTERED LINEAGE ( RENAME) : "at_risk" to "at_risk_skill_count"
          CTE : risk_agg : Wrapped : prediction_ranked : Source of Truth : student_skill_predictation

          COUNTS(*) WHERE LOWER(p.risk_level) = 'at_risk'
      - name: needs_practice_skill_count
        description: |-
          FILTERED LINEAGE ( RENAME) : "at_risk" to "needs_practice_skill_count"
          CTE : risk_agg : Wrapped : prediction_ranked : Source of Truth : student_skill_predictation

          COUNTS(*) WHERE LOWER(p.risk_level) = 'needs_practice'
      - name: active_recommendation_count
        description: |-
          FILTERED LINEAGE ( RENAME) : "is_completed to "active_recommendation_count"
          CTE : recommendation_agg : Source of Truth : learning_recommendations

          - "is_completed" WHERE = FALSE
      - name: highest_priority_recommendation
        description: |-
          FILTERED LINEAGE ( RENAME) : "is_completed" to "active_recommendation_count"
          CTE : recommendation_agg : Source of Truth : learning_recommendations

          - "is_completed" WHERE = FALSE # but position must be 1
  - name: vw_student_learning_summary
    description: "VIEW TABLE ( READ )


      No indexes, calculations already made from the raw tables


      FUNCTIONS THAT CREATED A VISIONARY TABLE ALONG WITH THE CALCULATIONS

      ___________________________________________________________________________________

      HAVE LINEAGE ( naturally fetch from the source of truth table ) :


      DIRECT LINEAGE :\ 

      - student_id

      - section_name

      - grade_level

      - learning_status

      - current_streak

      -  total_star_points

      ___________________________________________________________________________________

      NO LINEAGE ( created and calculated with its function inside the view ONLY )

      - total_sessions

      - completed_sessions

      - last_session

      - total_answer_attempts

      - correct_attempts

      - wrong_attempts

      - last_attempts

      - overall_accuracy_rate ( CREATED FROM NO LINEAGE ITSELF )

      - help_request_count

      - last_help_at

      - help_request_rate ( CREATED FROM NO LINEAGE ITSELF  )

      - latest_risk_level

      - latest_mastery_score

      - latest_prediction_at

      ___________________________________________________________________________________

      CTE:

      session_agg ( GROUP BY student_id )

      - \"total_sessions\"

      \  - all sessions count (*)


      - \"completed_sessions\"

      \  - WHERE session_status = 'completed'


      - \"last_session_at\"

      \  - MAX(COALESCE(s.ended_at, s.started_at, s.created_at))


      \ Source of truth ( WRITE ) :  ai_sessions\ 

      -------------------------------------------------------------------------------------

      CTE :

      attempt_agg ( GROUP BY student_id )

      - \"total_answer_attempts\" :

      \   - calculated the \"is_correct\" column and branch it into two calculated column


      - \"correct_attempts\" |  \"wrong_attempts\" :

      \   - calculated the \"is_correct\" column and branch it into two calculated column

      \   - IF TRUE +1 = \"correct_attempts\" | IF FALSE +1 = \"wrong_attempts\"


      - \"last_attempt_at\" :

      \   - gets the MAX(created_at) #Latest Record


      \  Source of truth ( WRITE ) :  student_attempts

      --------------------------------------------------------------------------------------

      help_agg ( GROUP BY student_id )


      - \"help_request_count\"

      \ - COUNT(*) #counts all records


      - \"last_help_at\"

      \ - MAX(h.created_at) #Latest Record


      \ Source of truth ( WRITE ) :  student_help_events

      -------------------------------------------------------------------------------------

      latest_prediction\ 


      - \"latest_risk_level\"

      - \"latest_mastery_score\"

      - \"latest_prediction_at\"


      all this because of Partition FROM the prediction_RANKED

      ROW_NUMBER() OVER (

      \            PARTITION BY p.student_id

      \            ORDER BY p.predicted_at DESC, p.prediction_id DESC

      \        ) AS row_num


      then on the created nested CTE it just get where row_num = 1

      # thats why the latest it renamed all column as \"latest\"


      \ Source of truth ( WRITE ) : MAIN: ( latest_prediction ( prediction_ranked ( INHERITED FROM student_skill_predictions : CTE (prediction_ranked))

      -------------------------------------------------------------------------------------

      recommendation_agg ( GROUP BY student_id )


      - \"active_recommendation_count\"

      \ - COUNT(*) #counts all records WHERE \"is_completed\" FALSE


      - \"latest_recommendation_text\"

      \ - checks the \"is_completed\" # position  on array must be [1] # second (2nd) on record



      Source of truth ( WRITE ) :  learning_recommendation"
    columns:
      - name: student_id
        description: Have Lineage
        data_type: integer
      - name: section_name
        description: Have Lineage
        data_type: character varying
      - name: grade_level
        description: Have Lineage
        data_type: smallint
      - name: learning_status
        description: Have Lineage
        data_type: text
      - name: current_streak
        data_type: integer
        description: Have Lineage
      - name: total_star_points
        data_type: double precision
        description: Have Lineage
      - name: total_sessions
        data_type: bigint
        description: |-
          FROM CTE : attempt_agg
          Source of Truth Table ( WRITE ) : 
          - ai_sessions ( * ) #counts all record
      - name: completed_sessions
        data_type: bigint
        description: |-
          FROM CTE : attempt_agg
          Source of Truth Table ( WRITE ) : 
          - ai_sessions ( (WHERE session_status = 'completed' )
      - name: last_session_at
        data_type: timestamp with time zone
        description: |-
          FROM CTE : attempt_agg
          Source of Truth Table ( WRITE ) :  
           - MAX(COALESCE(s.ended_at, s.started_at, s.created_at))
      - name: total_answer_attempts
        data_type: bigint
        description: |-
          FROM CTE : attempt_agg
             - calculated the "(*)" all records
      - name: correct_attempts
        description: |-
          FROM CTE : attempt_agg
          Source of Truth Table ( WRITE ) :
          - student_attempts ( is_correct )
        data_type: bigint
      - name: wrong_attempts
        description: |-
          FROM CTE : session_agg
          Source of Truth Table ( WRITE ) : ai_sessions
          - student_attempts ( is_correct )
        data_type: bigint
      - name: last_attempt_at
        data_type: timestamp with time zone
        description: |-
          FROM CTE : attempt_agg
          - Gets the MAX(created_at) #Latest Record
      - name: overall_accuracy_rate
        description: |-
          This is a computation column ( exist only on this VWT )

          Two columns use to calculate the accuracy
          - correct_attempts default : Numeric
          - total_ answer_ attempts : Numeric

          accuracy = (correct_attempts / total_answer_attempts ) :: Numeric , 4 ( 4 decimals only )
        data_type: numeric
      - name: help_request_count
        data_type: bigint
        description: |-
          FROM CTE : help_agg
           - COUNT(*) #counts all records
      - name: last_help_at
        data_type: timestamp with time zone
        description: |-
          FROM CTE : help_agg
          - MAX(h.created_at) #Latest Record
      - name: help_request_rate
        data_type: numeric
        description: |-
          This is a computation column ( exist only on this VWT )

          Two columns use to calculate the Request Rate
          - total_answer_attempts : Numeric
          - help_request_count : Numeric

           Request Rate = request_count / (total_answer_attempts +  request_coun ) :: Numeric , 4 ( 4 decimals only )
      - name: latest_risk_level
        data_type: text
        description: "FROM BABY CTE : latest_prediction (PARENT CTE : prediction_ranked)"
      - name: latest_mastery_score
        data_type: numeric
        description: "FROM BABY CTE : help_agg (PARENT CTE : prediction_ranked)"
      - name: latest_prediction_at
        data_type: timestamp with time zone
        description: "FROM BABY CTE : help_agg (PARENT CTE : prediction_ranked)"
      - name: active_recommendation_count
        data_type: bigint
        description: |-
          FROM CTE : recommendation_agg
          - counts all record WHERE is_completed is FALSE
      - name: latest_recommendation_text
        data_type: text
        description: "FROM CTE : recommendation_agg

          - checks the \"is_completed\" FROM learning_recommendation # position  on array must be [1] # second (2nd) on record"
      - name: last_activity_at
        data_type: timestamp with time zone
        description: |-
          FILTERED NO LINEAGE : GREATEST()
          - last_session_at,
          - last_attempt_at,
          - last_help_at,
          - latest_prediction_at
