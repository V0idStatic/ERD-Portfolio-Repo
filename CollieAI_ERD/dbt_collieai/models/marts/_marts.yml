version: 2

models:
  - name: mv_daily_student_performance
    description: "VIEW TABLE ( READ )


      INDEX:

      - ux_mv_daily_student_performance_grain

      - (student_id, performance_date)

      - Ensures one row per student per activity day and supports concurrent refresh.


      FUNCTIONS THAT CREATED A VISIONARY TABLE ALONG WITH THE CALCULATIONS

      CALCULATIONS ARE MADE ON THIS MV TABLE

      ___________________________________________________________________________________

      DIRECT LINEAGE ( naturally fetch from the source of truth table ) :


      Source of Truth : class_sections

      - section_name

      - grade_level


      UNION / DRIVING-GRAIN LINEAGE

      (creates the daily row list; not a source-of-truth table)


      CTE: activity_keys


      Source CTEs:

      - session_daily

      - attempt_daily

      - hint_daily

      - help_daily

      - dda_daily

      - show_me_daily


      ___________________________________________________________________________________

      FILTERED LINEAGE (created through a condition)


      CTE: session_daily : Source of Truth: ai_sessions


      - sessions_completed

      \  COUNT(*) FILTER (WHERE session_status = 'completed')


      CTE: attempt_daily : Source of Truth: student_attempts


      - correct_attempts : COUNT(*) FILTER (WHERE is_correct IS TRUE)


      - wrong_attempts : COUNT(*) FILTER (WHERE is_correct IS FALSE)


      CTE: hint_daily : Wrapped CTE: attempt_hint : Source of Truth: attempt_steps through student_attempts


      - hinted_attempt_count

      \  COUNT(*) FILTER (WHERE used_hint IS TRUE)


      CTE: final SELECT


      - accuracy_rate

      \  Returns NULL when total_answer_attempts = 0.


      RENAMED / DATE-NORMALIZED LINEAGE


      CTE: session_daily : Source of Truth: ai_sessions


      - performance_date

      \  created_at::date


      CTE: attempt_daily : Source of Truth: student_attempts


      - performance_date

      \  created_at::date


      CTE: help_daily : Source of Truth: student_help_events


      - performance_date

      \  created_at::date


      CTE: dda_daily : Source of Truth: dda_events


      - performance_date

      \  created_at::date


      CTE: show_me_daily : Source of Truth: show_me_breakdowns


      - performance_date

      \  created_at::date


      ___________________________________________________________________________________

      DERIVED AGGREGATED LINEAGE


      CTE: session_daily : Source of Truth: ai_sessions


      - sessions_started

      \  COUNT(*) per student per date


      CTE: attempt_daily : Source of Truth: student_attempts


      - total_answer_attempts

      \  COUNT(*) per student per date


      - avg_score

      \  AVG(score)


      - avg_time_spent_seconds

      \  AVG(time_spent_seconds)


      CTE: help_daily : Source of Truth: student_help_events


      - help_request_count

      \  COUNT(*) per student per date


      CTE: dda_daily : Source of Truth: dda_events


      - dda_trigger_count

      \  COUNT(*) per student per date


      CTE: show_me_daily : Source of Truth: show_me_breakdowns

      Bridge table: ai_sessions


      - show_me_count

      \  COUNT(*) per student per date


      Relationship used for student attribution:

      show_me_breakdowns.session_id → ai_sessions.session_id → ai_sessions.student_id


      ___________________________________________________________________________________

      RENAMED / DATE-NORMALIZED LINEAGE


      CTE: session_daily : Source of Truth: ai_sessions


      - performance_date

      \  created_at::date


      CTE: attempt_daily : Source of Truth: student_attempts


      - performance_date

      \  created_at::date


      CTE: help_daily : Source of Truth: student_help_events


      - performance_date

      \  created_at::date


      CTE: dda_daily : Source of Truth: dda_events


      - performance_date

      \  created_at::date


      CTE: show_me_daily : Source of Truth: show_me_breakdowns


      - performance_date

      \  created_at::date"
    columns:
      - name: performance_date
        description: RENAMED / DATE-NORMALIZED LINEAGE
      - name: student_id
      - name: section_name
        description: DIRECT LINEAGE
      - name: grade_level
        description: DIRECT LINEAGE
      - name: sessions_started
        description: DERIVED AGGREGATED LINEAGE


          COUNT(*) per student per date
      - name: sessions_completed
        description: |-
          FILTERED LINEAGE

           COUNT(*) FILTER (WHERE session_status = 'completed')
      - name: total_answer_attempts
        description: DERIVED AGGREGATED LINEAGE
      - name: correct_attempts
        description: |-
          FILTERED LINEAGE

          COUNT(*) FILTER (WHERE is_correct IS TRUE)
      - name: wrong_attempts
        description: |-
          FILTERED LINEAGE

          COUNT(*) FILTER (WHERE is_correct IS FALSE
      - name: avg_score
        description: |-
          DERIVED AGGREGATED LINEAGE

          COUNT(*) per student per date
      - name: avg_time_spent_seconds
        description: |-
          DERIVED AGGREGATED LINEAGE
           AVG(time_spent_seconds)
      - name: hinted_attempt_count
        description: |-
          DERIVED AGGREGATED LINEAGE

          COUNT(*) FILTER (WHERE used_hint IS TRUE)
      - name: help_request_count
        description: |-
          DERIVED AGGREGATED LINEAGE

           COUNT(*) per student per date
      - name: dda_trigger_count
        description: |-
          DERIVED AGGREGATED LINEAGE

           COUNT(*) per student per date
      - name: show_me_count
        description: |-
          DERIVED AGGREGATED LINEAGE

           COUNT(*) per student per date
      - name: accuracy_rate
        description: |-
          DERIVED AGGREGATED LINEAGE

          correct_attempts ÷ total_answer_attempts
