version: 2

models:
  - name: vw_column_lineage
    description: "Queryable column-level lineage for the three materialized views. Each row explains an MV output column's source field and transformation."
    columns:
      - name: mv_name
        description: "Materialized view containing the output column."
      - name: mv_column
        description: "Output column in the materialized view."
      - name: source_table
        description: "Source-of-truth table contributing to the output."
      - name: source_column
        description: "Column read from the source table."
      - name: transformation
        description: "SQL aggregation, calculation, or lookup applied to the source column."
      - name: lineage_type
        description: "Whether the value is passed through directly or derived."
  - name: mv_daily_student_performance
    description: "Final materialized view endpoint with explicit columns for lineage."
    columns:
      - name: performance_date
      - name: student_id
      - name: section_name
      - name: grade_level
      - name: sessions_started
      - name: sessions_completed
      - name: total_answer_attempts
      - name: correct_attempts
      - name: wrong_attempts
      - name: avg_score
      - name: avg_time_spent_seconds
      - name: hinted_attempt_count
      - name: help_request_count
      - name: dda_trigger_count
      - name: show_me_count
      - name: accuracy_rate
